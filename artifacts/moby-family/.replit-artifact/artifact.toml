kind = "web"
previewPath = "/"
title = "Moby Family"
description = "A family banking app prototype for parents and children, with family accounts, pocket money, savings goals, transactions and child settings. Interactive screens use local demo state without an API."
version = "1.0.0"
id = "artifacts/moby-family"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22469

[services.development]
run = "pnpm --filter @workspace/moby-family run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moby-family", "run", "build" ]
serve = "static"
publicDir = "artifacts/moby-family/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22469"
BASE_PATH = "/"
